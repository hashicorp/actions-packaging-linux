name: test
on:
  pull_request:

jobs:
  packaging:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Make sure it handles running in workflows that haven't set up a Go toolchain
        go_toolchain_preinstalled:
          - true
          - false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: build
      - if: matrix.go_toolchain_preinstalled == true
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version-file: build/go.mod
      - name: build binary
        id: build
        working-directory: build
        run: |
          go build -o template .
          echo "binary-path=build/template" | tee -a "$GITHUB_OUTPUT"
          ls -la
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: action
      - uses: ./action
        with:
          name: template
          description: Test packing the binary
          arch: amd64
          version: 1.0.0
          maintainer: HashiCorp
          homepage: https://github.com/hashicorp/actions-packaging-linux
          license: MPL-2.0
          binary: ${{ steps.build.outputs.binary-path }}
          bin_path: /usr/local/bin
          file_permissions: 0o027
          user_owner: root
          group_owner: vault
          rpm_depends: bash
          rpm_recommends: dmidecode
          deb_depends: bash
          deb_recommends: dmidecode

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.go_toolchain_preinstalled == true # only need one set of artifacts
        with:
          name: artifacts
          path: out
          if-no-files-found: 'error'

      # Note: "suggested" is always empty, as nFPM does not (yet?) support it.
      - name: dump RPM
        run: |
          /bin/ls -l out/
          echo "::group::maybe install rpm" 1>&2
          # runner is ubuntu, install rpm if it's not already available
          which rpm || apt-get install -y rpm
          echo "::endgroup::" 1>&2

          echo "::group::package contents" 1>&2
          rpm -qplv out/*.rpm
          echo "::endgroup::" 1>&2

          echo "::group::dependencies" 1>&2
          rpm -qpv --requires out/*.rpm
          echo "::endgroup::" 1>&2
          echo "::group::weak dependencies: recommended packages" 1>&2
          rpm -qpv --recommends out/*.rpm
          echo "::endgroup::" 1>&2
          echo "::group::weak dependencies: suggested packages" 1>&2
          rpm -qpv --suggests out/*.rpm
          echo "::endgroup::" 1>&2

      - name: dump deb
        run: |
          /bin/ls -l out/
          echo "::group::package contents" 1>&2
          dpkg -c ./out/*.deb
          echo "::endgroup::" 1>&2

          echo "::group::dependencies and recommended packages" 1>&2
          apt-cache show ./out/*.deb | grep -E '^(Depends|Recommends|Suggests):' || true
          echo "::endgroup::" 1>&2

  cache-prime:
    name: cache-prime (${{ matrix.nfpm_version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nfpm_version:
          - Latest
          - v2.47.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: build
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version-file: build/go.mod
      - name: build binary
        id: build
        working-directory: build
        run: |
          go build -o template .
          echo "binary-path=build/template" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: action
      - uses: ./action
        with:
          name: template
          description: Test packing the binary
          arch: amd64
          version: 1.0.0
          maintainer: HashiCorp
          homepage: https://github.com/hashicorp/actions-packaging-linux
          license: MPL-2.0
          binary: ${{ steps.build.outputs.binary-path }}
          bin_path: /usr/local/bin
          nfpm_version: ${{ matrix.nfpm_version }}
          nfpm_cache: 'true'

  cache-verify:
    # Verify the cache hit as separate jobs. We have to do this because cache
    # saves are post run so verify has to be separate from the prime job.
    name: cache-verify (${{ matrix.nfpm_version }})
    needs: cache-prime
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nfpm_version:
          - Latest
          - v2.47.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: build
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version-file: build/go.mod
      - name: build binary
        id: build
        working-directory: build
        run: |
          go build -o template .
          echo "binary-path=build/template" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: action
      - uses: ./action
        id: action
        with:
          name: template
          description: Test packing the binary
          arch: amd64
          version: 1.0.0
          maintainer: HashiCorp
          homepage: https://github.com/hashicorp/actions-packaging-linux
          license: MPL-2.0
          binary: ${{ steps.build.outputs.binary-path }}
          bin_path: /usr/local/bin
          nfpm_version: ${{ matrix.nfpm_version }}
          nfpm_cache: 'true'
      - name: Verify cache was hit
        run: |
          if [ "${{ steps.action.outputs.nfpm-cache-hit }}" != "true" ]; then
            echo "::error::Cache was not hit for nfpm_version=${{ matrix.nfpm_version }}"
            exit 1
          fi
          echo "Cache hit confirmed for nfpm_version=${{ matrix.nfpm_version }}"
